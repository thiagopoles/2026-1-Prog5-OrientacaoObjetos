<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cafeteria - Cadastrar</title>
<link rel="stylesheet" type="text/css" href="estilo.css">
</head>
<body>
	<h2>Cadastrar Item no Cardápio</h2>
	<form name="fCadastra" method="post" action="CadastraServlet">
		<p>
			Nome do Produto: <input type="text" name="txNome" required>
		</p>
		<p>
			Preço: <input type="number" step="0.01" name="txPreco" required>
		</p>
		<p>
			<input type="submit" value="Cadastrar">
		</p>
		<p>
			<a href="index.html" class="btn-voltar">Voltar ao Menu</a>
		</p>
	</form>
</body>
</html>
